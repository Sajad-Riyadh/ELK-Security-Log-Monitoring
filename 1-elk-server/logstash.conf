# =============================================================================
# Logstash Pipeline Configuration
# Receives logs from Beats agents, parses SSH auth events (supporting both
# Ubuntu 24.04 ISO-8601 timestamps and traditional RFC3164 syslog timestamps),
# enriches Windows Event Logs, and stores everything in Elasticsearch under a
# daily security-logs index.
# =============================================================================

input {
  beats {
    port => 5044
  }
}

filter {
  # ---- Linux SSH authentication log parsing ----
  if [log][file][path] == "/var/log/auth.log" or [log][file][path] == "/var/log/secure" {
    grok {
      match => {
        "message" => [
          "(?:%{SYSLOGTIMESTAMP:syslog_timestamp}|%{TIMESTAMP_ISO8601:syslog_timestamp}) %{HOSTNAME:source_host} sshd\[%{POSINT:sshd_pid}\]: Failed password for (invalid user )?%{USERNAME:ssh_user} from %{IP:src_ip} port %{INT:src_port} ssh2",
          "(?:%{SYSLOGTIMESTAMP:syslog_timestamp}|%{TIMESTAMP_ISO8601:syslog_timestamp}) %{HOSTNAME:source_host} sshd\[%{POSINT:sshd_pid}\]: Accepted password for %{USERNAME:ssh_user} from %{IP:src_ip} port %{INT:src_port} ssh2",
          "(?:%{SYSLOGTIMESTAMP:syslog_timestamp}|%{TIMESTAMP_ISO8601:syslog_timestamp}) %{HOSTNAME:source_host} sshd\[%{POSINT:sshd_pid}\]: %{GREEDYDATA:ssh_event}"
        ]
      }
      tag_on_failure => ["_grokparsefailure_ssh"]
    }

    # Tag the event type for easier filtering in Kibana
    if "Failed password" in [message] {
      mutate { add_field => { "event_type" => "ssh_failed_login" } }
    } else if "Accepted password" in [message] {
      mutate { add_field => { "event_type" => "ssh_successful_login" } }
    }
  }

  # ---- Windows Event Log enrichment ----
  if [winlog] {
    if [winlog][event_id] == 4625 or [winlog][event_id] == "4625" {
      mutate { add_field => { "event_type" => "windows_failed_login" } }
    } else if [winlog][event_id] == 4624 or [winlog][event_id] == "4624" {
      mutate { add_field => { "event_type" => "windows_successful_login" } }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "security-logs-%{+YYYY.MM.dd}"
  }
}
